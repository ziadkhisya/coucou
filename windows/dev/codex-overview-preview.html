<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coucou Codex overview preview</title>
    <style>
      #preview-backdrop { position: fixed; inset: 0; background: #090a0c; }
      body:not(.preview-collapsed) #island { width: 640px !important; transform: translateX(-50%) !important; }
      #content { opacity: 1 !important; }
      .view.on { opacity: 1 !important; }
      body.preview-collapsed #content { opacity: 0 !important; pointer-events: none !important; }
      body.preview-collapsed #compact-progress { opacity: 1 !important; }
      #preview-controls { position: fixed; z-index: 20; top: 244px; left: 8px; right: 8px; max-width: calc(100vw - 16px); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 5px; padding: 7px; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; background: #151619; }
      #preview-controls > span { padding: 0 5px; color: #6b7079; font: 600 8px system-ui,sans-serif; letter-spacing: .08em; }
      #preview-controls button { border: 0; border-radius: 7px; padding: 5px 7px; background: transparent; color: #a6abb2; font: 500 9px system-ui,sans-serif; cursor: pointer; }
      #preview-controls button:hover, #preview-controls button.selected { background: #282b30; color: #f5f6f8; }
    </style>
  </head>
  <body>
    <div id="preview-backdrop"></div>
    <div id="root"></div>
    <nav id="preview-controls" aria-label="Preview states">
      <span>PREVIEW</span>
      <button data-toggle-compact>Toggle compact</button>
      <button data-state="five">5-step plan</button>
      <button data-state="one">One-step fallback</button>
      <button data-state="usage">5h + week</button>
      <button data-state="low">Low remaining</button>
      <button data-state="mixed">Mixed severity</button>
      <button data-state="stale">Stale usage</button>
      <button data-state="unavailable">Usage unavailable</button>
      <button data-state="overhour">Timer &gt; 1 hour</button>
      <button data-state="longtitle">Long task title</button>
      <button data-state="long">Long project</button>
      <button data-state="longplan">Long plan text</button>
      <button data-state="taskchange">Task title change</button>
      <button data-state="newtask">Same project · new task</button>
      <button data-state="sameproject">Same project tasks</button>
      <button data-state="finished">Finished plan</button>
      <button data-state="two">Two sessions</button>
      <button data-state="many">4 sessions</button>
      <button data-state="rail">Rail mix</button>
      <button data-state="update">Live plan update</button>
      <button data-state="approval">Permission</button>
      <button data-state="longpermission">Long permission</button>
      <button data-state="collapsedactive">Collapsed fallback</button>
      <button data-state="collapsedplan">Collapsed plan</button>
    </nav>
    <script type="module" src="./codex-overview-preview.ts"></script>
  </body>
</html>
